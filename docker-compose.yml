# Local development services. Run: docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aimers
      POSTGRES_PASSWORD: aimers
      POSTGRES_DB: aimers
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimers"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
